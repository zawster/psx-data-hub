name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run pytest
        env:
          PYTHONPATH: src
        run: python -m pytest -q

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Run dockerized smoke checks
        run: docker compose --profile smoke up --build --abort-on-container-exit --exit-code-from smoke-check
      - name: Tear down smoke compose
        if: always()
        run: docker compose --profile smoke down -v
