[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psx-data-hub"
version = "0.2.0"
description = "Open-source PSX delayed data API (5-minute delayed baseline)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "python-dateutil>=2.9",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.9",
  "bcrypt>=4.0.1,<4.1.0"
]

[project.scripts]
psx-data-hub-worker = "psx_data_hub.worker:main"

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/psx_data_hub"]
